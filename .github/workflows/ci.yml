name: CI

on:
  push:

jobs:
  test:
    name: Install test
    timeout-minutes: 60
    runs-on: macOS-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install dotfiles
        run: CI=true ./setup/setup.zsh

  shellspec:
    name: ShellSpec tests
    timeout-minutes: 10
    runs-on: macOS-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install ShellSpec
        run: brew install shellspec
      - name: Run tests
        run: shellspec --shell bash

  nix-flake-check:
    name: Nix flake check
    # Syntax/evaluation check only — does not run `darwin-rebuild switch`
    # or otherwise mutate anything outside this runner. See
    # docs/nix-migration.md "CI".
    timeout-minutes: 20
    runs-on: macOS-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: nix flake check
        run: nix flake check
